<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Written by media/og.py with an absolute path: fontconfig resolves a
     relative <dir> against the CWD, not against this file, so a relative one
     silently falls back to Helvetica. -->
<fontconfig>
  <dir>/Users/aaronphillips/GIT/boatdecals/media/fonts</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir>/tmp/boatdecals-fontcache</cachedir>
</fontconfig>
